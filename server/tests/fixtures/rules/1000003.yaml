# 응용 프로그램 오류 다발 — 분류 '응용 프로그램'(Application 채널)의 오류(수준 2)
rule: 1000003
match:
  - why: 응용 프로그램 충돌(Application Error 1000)은 Application 채널의 오류
    windows: {event: 1000, envelope: 7045}
    ref: https://learn.microsoft.com/troubleshoot/windows-server/performance/troubleshoot-application-service-crashing-behavior
    fields:
      ProviderName: Application Error
      ProviderGuid: "{a0e9b465-b939-57d7-b27d-95d8e925ff57}"
      Channel: Application
      Level: 2
      Keywords: "0x8000000000000000"
      Version: 0
      Qualifiers: ""
      Task: 100
      Message: "Faulting application name: emr.exe, version: 2.4.0.1, time stamp: 0x6543a1b2\r\nFaulting module name: KERNELBASE.dll, version: 10.0.26100.2454, time stamp: 0x1a2b3c4d\r\nException code: 0xe0434352\r\nFault offset: 0x000000000005b5ec\r\nFaulting process id: 0x1f40\r\nFaulting application start time: 0x01db3a1c2f5e7c11\r\nFaulting application path: C:\\EMR\\emr.exe\r\nFaulting module path: C:\\Windows\\System32\\KERNELBASE.dll\r\nReport Id: 5f1d9e7a-0b4c-4d5e-9f6a-7b8c9d0e1f2a\r\nFaulting package full name: \r\nFaulting package-relative application ID: "
    strings: [emr.exe, 2.4.0.1, 6543a1b2, KERNELBASE.dll, 10.0.26100.2454, 1a2b3c4d, e0434352, 000000000005b5ec, 1f40, 01db3a1c2f5e7c11, 'C:\EMR\emr.exe', 'C:\Windows\System32\KERNELBASE.dll', 5f1d9e7a-0b4c-4d5e-9f6a-7b8c9d0e1f2a, "", ""]
no_match:
  - why: 같은 채널의 정보(수준 4) — 오류 보고(Windows Error Reporting 1001)
    fails_on: [level]
    windows: {event: 1001, envelope: 7045}
    ref: "https://learn.microsoft.com/troubleshoot/windows-server/performance/troubleshoot-application-service-crashing-behavior — 1000 과 함께 Application 로그에 남는다는 것만 확인, 수준·필드는 윈도 CI 실측 전 추정"
    fields:
      ProviderName: Windows Error Reporting
      ProviderGuid: ""
      Channel: Application
      Level: 4
      Keywords: "0x80000000000000"
      Version: 0
      Qualifiers: 0
      Message: "Fault bucket 1234567890123456789, type 4\r\nEvent Name: APPCRASH\r\nResponse: Not available\r\nCab Id: 0\r\n\r\nProblem signature:\r\nP1: emr.exe\r\nP2: 2.4.0.1"
    strings: ["1234567890123456789", "4", APPCRASH, Not available, "0", emr.exe, 2.4.0.1, "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", ""]
  - why: SQL Server 가 Application 채널에 쓴 오류는 분류가 'DB (MSSQL)' — 응용 프로그램 오류로 세지 않는다 (1000019)
    fails_on: [category]
    windows: {event: 3041, envelope: 7045}
    ref: https://learn.microsoft.com/sql/relational-databases/errors-events/database-engine-events-and-errors-3000-to-3999
    fields:
      ProviderName: MSSQLSERVER
      ProviderGuid: ""
      Channel: Application
      Level: 2
      Keywords: "0x80000000000000"
      Version: 0
      Qualifiers: 16384
      Task: 6
      Message: "BACKUP failed to complete the command BACKUP DATABASE emr. Check the backup application log for detailed messages."
    strings: [BACKUP DATABASE emr]
  - why: System 채널의 오류는 분류가 '시스템' (1000002)
    fails_on: [category]
    windows: {event: 7034, envelope: 7045}
    ref: 'wevtutil gp "Service Control Manager" /ge /gm:true — 7034'
    fields:
      ProviderName: Service Control Manager
      Channel: System
      Level: 2
      Keywords: "0x8080000000000000"
      Version: 0
      Qualifiers: 49152
      Message: "The Print Spooler service terminated unexpectedly.  It has done this 1 time(s)."
    strings: [Print Spooler, "1"]
