# 계정 잠금 — 4740, 잠긴 계정으로 묶는다
rule: 1000008
match:
  - why: 계정 잠금(4740) — 잠긴 계정은 TargetUserName, TargetDomainName 은 '호출한 PC'(도메인이 아님)
    windows: {event: 4740, envelope: 4720}
    ref: https://learn.microsoft.com/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4740
    fields:
      ProviderName: Microsoft-Windows-Security-Auditing
      Channel: Security
      Level: 0
      Keywords: "0x8020000000000000"
      Version: 0
      Task: 13824
      Message: "A user account was locked out.\r\n\r\nSubject:\r\n\tSecurity ID:\t\tS-1-5-18\r\n\tAccount Name:\t\tDC-01$\r\n\tAccount Domain:\t\tCORP\r\n\tLogon ID:\t\t0x3E7\r\n\r\nAccount That Was Locked Out:\r\n\tSecurity ID:\t\tS-1-5-21-1111111111-2222222222-3333333333-1104\r\n\tAccount Name:\t\tkim\r\n\r\nAdditional Information:\r\n\tCaller Computer Name:\tWS-0117"
    inserts:
      TargetUserName: kim
      TargetDomainName: WS-0117
      TargetSid: S-1-5-21-1111111111-2222222222-3333333333-1104
      SubjectUserSid: S-1-5-18
      SubjectUserName: DC-01$
      SubjectDomainName: CORP
      SubjectLogonId: "0x3e7"
no_match:
  - why: 로그온 실패(4625)는 잠금이 아니다 — 잠금은 실패가 기준을 넘었을 때 따로 남는다
    fails_on: [event_id]
    windows: {event: 4625, where: {LogonType: 3}}
  - why: 계정 삭제(4726)
    fails_on: [event_id]
    windows: {event: 4726}
