# SQL Server 심각 오류 — 디스크 I/O(823·824·825), 로그 가득 참(9002), 백업 실패(3041), 메모리 부족(701)
rule: 1000019
match:
  - why: ERRORLOG 의 디스크 읽기 오류 — 번호는 'Error:' 머리줄에만 있어 다음 본문 줄이 823 을 받는다
    mssql:
      - "2026-11-09 03:12:45.71 spid87      Error: 823, Severity: 24, State: 2."
      - "2026-11-09 03:12:45.71 spid87      The operating system returned error 21(The device is not ready.) to SQL Server during a read at offset 0x0000000001c000 in file 'D:\\DATA\\emr.mdf'. Additional messages in the SQL Server error log and system event log may provide more detail. This is a severe system-level error condition that threatens database integrity and must be corrected immediately. Complete a full database consistency check (DBCC CHECKDB). This error can be caused by many factors; for more information, see SQL Server Books Online."
    ref: https://learn.microsoft.com/sql/relational-databases/errors-events/mssqlserver-823-database-engine-error
  - why: 트랜잭션 로그 가득 참(9002)이 Application 이벤트 로그로 온 것
    windows: {event: 9002, envelope: 7045}
    ref: https://learn.microsoft.com/sql/relational-databases/errors-events/mssqlserver-9002-database-engine-error
    fields:
      ProviderName: MSSQLSERVER
      ProviderGuid: ""
      Channel: Application
      Level: 2
      Keywords: "0x80000000000000"
      Version: 0
      Qualifiers: 49152
      Task: 2
      Message: "The transaction log for database 'emr' is full due to 'LOG_BACKUP'."
    strings: [emr, LOG_BACKUP]
no_match:
  - why: 로그인 실패(18456)는 심각 오류가 아니다 (1000018)
    fails_on: [event_id]
    mssql:
      - "2026-11-09 10:15:22.53 Logon       Error: 18456, Severity: 14, State: 8."
      - "2026-11-09 10:15:22.53 Logon       Login failed for user 'sa'. Reason: Password did not match that for the login provided. [CLIENT: 10.20.30.41]"
    ref: https://learn.microsoft.com/sql/relational-databases/errors-events/mssqlserver-18456-database-engine-error
  - why: 'Error: 머리줄 혼자는 번호 없이 상세(5)로 저장된다 — 본문 줄과 이중으로 세지 않게'
    fails_on: [event_id]
    mssql: "2026-11-09 03:12:45.71 spid87      Error: 823, Severity: 24, State: 2."
    ref: https://learn.microsoft.com/sql/relational-databases/errors-events/mssqlserver-823-database-engine-error
  - why: 업무 프로그램이 Application 로그에 쓴 701 — SQL Server 의 메모리 부족이 아니다 (분류가 응용 프로그램)
    fails_on: [category]
    windows: {event: 701, envelope: 7045}
    ref: https://learn.microsoft.com/dotnet/api/system.diagnostics.eventlog.writeentry
    fields:
      ProviderName: EMRService
      ProviderGuid: ""
      Channel: Application
      Level: 2
      Keywords: "0x80000000000000"
      Version: 0
      Qualifiers: 0
      Task: 0
      Message: "Print queue 701 failed."
    strings: ["701"]
