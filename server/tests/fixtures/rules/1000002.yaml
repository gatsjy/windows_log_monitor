# 서비스 비정상 종료 — 서비스 제어 관리자 7031·7034
rule: 1000002
match:
  - why: 서비스 프로세스가 예기치 않게 끝남, 복구 동작 없음(7034) — 복구 동작을 지운 스풀러를 강제로 끝낸 실측(마지막 값은 서비스 이름의 Binary 16진)
    windows: {event: 7034}
  - why: 예기치 않게 끝나 복구 동작(다시 시작)이 걸림(7031) — 스풀러를 강제로 끝낸 실측
    windows: {event: 7031}
no_match:
  - why: 상태 바뀜(7036)은 정상 시작·중지 — 서비스가 실행 상태로 바뀐 실측(보조 로그온 서비스 시작)
    fails_on: [event_id]
    windows: {event: 7036}
  - why: 서비스 설치(7045)는 다른 규칙(1000011)
    fails_on: [event_id]
    windows: {event: 7045}
