# 이벤트 보관 등급 (BACKLOG B-70, ADR-061) — 고른 로그의 보관 파일 기간만 따로 정합니다.
#
# 등급이 없으면 모든 로그가 WLM_RETENTION_DAYS(기본 365일) 동안 남습니다(DB WLM_DB_RETENTION_DAYS 뒤에는 보관 파일로).
# 등급을 두면 DB 보관기간이 지난 달을 보관 파일로 옮길 때 로그마다 등급을 골라 events_YYYY_MM.<id>.jsonl.gz 로 따로 둡니다.
#
# - query: 검색 문장 (검색 화면과 같은 문법). 한 로그가 여러 등급에 맞으면 가장 긴 등급, 어디에도 안 맞으면 기본(WLM_RETENTION_DAYS).
# - keep_days: 그 달 끝부터 보관 파일을 두는 날수 (1~3650). 늘리면 이미 만든 파일도 늘어나고, 줄여도 이미 만든 파일은 만들 때 기간보다
#   일찍 지우지 않습니다. DB 보관기간보다 짧으면 보관 파일을 만들지 않고 DB 에서 지울 때 함께 사라집니다.
# - id: 영문 소문자로 시작하는 32자 이내(소문자·숫자·-) — 파일 이름에 들어가므로 정한 뒤에는 바꾸지 마세요.
# - 어떤 로그가 '접속기록'(법정 1년, 민감정보 처리 시스템 2년)인지는 사이트가 정합니다. 짧은 등급에 접속기록이 들어가지 않게 하세요.
# - 이 파일이 틀리면 고칠 때까지 보관 파일 만들기·삭제를 멈춥니다(로그는 DB 에 그대로) — 환경설정 > 로그 보관 화면에 이유가 보입니다.
#
# 예 — 아래 줄마다 '# '(샵과 빈칸 하나)만 지우면 됩니다. tiers: 는 이미 있으니 다시 쓰지 마세요(같은 키가 두 번이면 오류):
tiers:
  # - id: emr-access
  #   name: 진료정보 시스템 접속기록
  #   query: 'host:EMR-DB-01,EMR-WAS-01 category:security'
  #   keep_days: 730
  # - id: web
  #   name: 웹 요청(IIS)
  #   query: 'source:iis'
  #   keep_days: 180
