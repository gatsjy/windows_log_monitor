# Log Monitor — 기본(운영 기준) 구성
#   개발:  docker compose up --build             (docker-compose.override.yml 자동 병합)
#   운영:  docker compose -f docker-compose.yml up -d --build
#   폐쇄망: 빌드하지 않고 반입한 이미지로 기동 — deploy/airgap/install.sh (docs/AIRGAP.md)
#   syslog 수신기 포함:  --profile syslog 추가
# 설정값은 .env 파일로 덮어쓴다 (.env.example 참고)

name: log-monitor

# 컨테이너 로그(docker logs) 로테이션: 파일당 50MB × 5개까지만 (기본값은 무제한으로 쌓인다)
x-logging: &logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wlm}
      POSTGRES_USER: ${POSTGRES_USER:-wlm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wlm-dev-password}
      TZ: UTC
    # 성능 설정 (docs/PERFORMANCE.md §4). 기본값은 메모리 4GB 서버 기준 — 8GB 이상이면 .env 로 올린다.
    # shared_buffers 는 기동 때 잡아 두고 돌려주지 않는 캐시라 '메모리가 안 줄어드는' 것처럼 보이는 게 정상이다.
    command:
      - postgres
      - -c
      - shared_buffers=${WLM_PG_SHARED_BUFFERS:-512MB}
      - -c
      - effective_cache_size=${WLM_PG_EFFECTIVE_CACHE_SIZE:-1536MB}
      - -c
      - work_mem=${WLM_PG_WORK_MEM:-16MB}
      - -c
      - maintenance_work_mem=${WLM_PG_MAINTENANCE_WORK_MEM:-128MB}
      - -c
      - max_parallel_workers_per_gather=${WLM_PG_PARALLEL_WORKERS:-2}
      - -c
      - max_connections=${WLM_PG_MAX_CONNECTIONS:-40}   # api 풀 10개 + 관리·백업 여유. 연결마다 수 MB 를 쓴다
      - -c
      - random_page_cost=1.1      # SSD
      - -c
      - jit=off                   # 짧은 조회가 많아 JIT 컴파일 비용이 더 크다
    shm_size: ${WLM_PG_SHM_SIZE:-512m}   # 병렬 조회가 쓰는 공유 메모리 (Docker 기본 64MB 는 부족)
    # 컨테이너 상한: 넘으면 커널이 먼저 페이지 캐시를 비우므로, 한 컨테이너가 서버 메모리를 다 차지하지 못한다
    mem_limit: ${WLM_DB_MEM_LIMIT:-1536m}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 30

  api:
    # 폐쇄망에서는 반입한 이미지(log-monitor-api:<버전>)를 그대로 쓴다. 없으면 build 로 만든다.
    image: ${WLM_API_IMAGE:-log-monitor-api:latest}
    build:
      context: .
      dockerfile: server/Dockerfile
      target: runtime
    restart: unless-stopped
    logging: *logging
    # 정상 사용은 200~400MB. 상한을 두면 큰 요청이 몰려도 서버 전체가 멈추지 않고 이 컨테이너만 재시작된다
    mem_limit: ${WLM_API_MEM_LIMIT:-768m}
    depends_on:
      db:
        condition: service_healthy
    environment:
      # glibc 는 스레드마다 메모리 영역(arena)을 따로 잡아 해제한 메모리를 OS 에 잘 돌려주지 않는다 → 2개로 제한
      MALLOC_ARENA_MAX: "2"
      WLM_DATABASE_URL: postgresql://${POSTGRES_USER:-wlm}:${POSTGRES_PASSWORD:-wlm-dev-password}@db:5432/${POSTGRES_DB:-wlm}
      WLM_INGEST_API_KEYS: ${WLM_INGEST_API_KEYS:-dev-ingest-key}
      WLM_INGEST_PORT: ${WLM_INGEST_PORT:-6976}   # 에이전트 설치 묶음에 적어 줄 수집 포트
      # 로그 로테이션: DB 에서 바로 검색 → (지나면) 압축 보관 파일 → (지나면) 삭제
      WLM_DB_RETENTION_DAYS: ${WLM_DB_RETENTION_DAYS:-90}
      WLM_RETENTION_DAYS: ${WLM_RETENTION_DAYS:-365}
      WLM_HEARTBEAT_ONLINE_SEC: ${WLM_HEARTBEAT_ONLINE_SEC:-90}
      WLM_HEARTBEAT_STALE_SEC: ${WLM_HEARTBEAT_STALE_SEC:-900}
      WLM_LOG_LEVEL: ${WLM_LOG_LEVEL:-INFO}
      WLM_SEARCH_TIMEOUT_SEC: ${WLM_SEARCH_TIMEOUT_SEC:-30}   # 화면 검색 쿼리 시간 상한 — 느린 검색이 쌓여 수집을 막지 않게
      # 알림 (Phase 2) — 링크 주소, 메일 서버
      WLM_PUBLIC_URL: ${WLM_PUBLIC_URL:-http://localhost:8080}
      WLM_DISPLAY_TZ: ${WLM_DISPLAY_TZ:-Asia/Seoul}
      WLM_SMTP_HOST: ${WLM_SMTP_HOST:-}
      WLM_SMTP_PORT: ${WLM_SMTP_PORT:-587}
      WLM_SMTP_SECURITY: ${WLM_SMTP_SECURITY:-starttls}
      WLM_SMTP_USER: ${WLM_SMTP_USER:-}
      WLM_SMTP_PASSWORD: ${WLM_SMTP_PASSWORD:-}
      WLM_SMTP_FROM: ${WLM_SMTP_FROM:-log-monitor@localhost}
      # 환경설정 화면에서 저장하는 비밀번호(SMTP·Oracle·웹훅 토큰) 암호화 키 — 운영에서는 반드시 설정, 잃어버리지 말 것
      WLM_SECRET_KEY: ${WLM_SECRET_KEY:-}
      # 인증 (기본값은 docs/PROJECT.md 인증 절 참고)
      WLM_SESSION_IDLE_MIN: ${WLM_SESSION_IDLE_MIN:-30}
      WLM_SESSION_MAX_HOURS: ${WLM_SESSION_MAX_HOURS:-12}
      WLM_LOGIN_MAX_FAILURES: ${WLM_LOGIN_MAX_FAILURES:-5}
      WLM_LOGIN_LOCKOUT_MIN: ${WLM_LOGIN_LOCKOUT_MIN:-10}
      WLM_PASSWORD_MAX_AGE_DAYS: ${WLM_PASSWORD_MAX_AGE_DAYS:-90}
      WLM_COOKIE_SECURE: ${WLM_COOKIE_SECURE:-false}
      WLM_ADMIN_INITIAL_PASSWORD: ${WLM_ADMIN_INITIAL_PASSWORD:-}
      WLM_API_DOCS: ${WLM_API_DOCS:-true}
      # 백업 일정 (backup 서비스와 같은 값) — 화면에 일정과 '백업이 오래됨' 경고를 보여 주는 데만 쓴다
      WLM_BACKUP_TIME: ${WLM_BACKUP_TIME:-02:30}
      WLM_BACKUP_KEEP: ${WLM_BACKUP_KEEP:-14}
      WLM_BACKUP_VERIFY_WEEKDAY: ${WLM_BACKUP_VERIFY_WEEKDAY:-7}
    # alerts.yaml 의 ${변수} (Oracle 비밀번호, 웹훅 토큰 등)를 .env 에서 넘겨받기 위함
    env_file:
      - path: .env
        required: false
    ports:
      - "${WLM_PORT:-8080}:8000"          # 웹 화면 + API (관리자·사용자)
      - "${WLM_INGEST_PORT:-6976}:8001"   # 에이전트 로그 수집 전용 (/api/ingest 만 열림)
    volumes:
      - ./server/app:/app/app                         # 코드 변경 시 이미지 재빌드 없이 바로 반영 (폐쇄망 핫픽스 지원)
      - ./server/migrations:/app/migrations           # DB 마이그레이션 자동 반영
      - ./web:/app/web                                 # 웹 UI 변경 시 즉시 반영
      - ./config:/app/config                           # 대시보드·알림 규칙·tnsnames.ora (화면에서 저장하면 이 폴더에 기록됨)
      - ./archive:/app/archive                         # 로그 보관 파일 (*.jsonl.gz + SHA-256 메타). 백업·별도 보관 대상
      - ./agent-installers:/app/agent-installers:ro   # Fluent Bit 설치 파일 → 에이전트 설치 묶음에 포함 (docs/AIRGAP.md)

  # DB 정기 백업 + 주 1회 복구 시험 (deploy/backup/backup.sh, ADR-031). db 와 같은 이미지라 폐쇄망 묶음에 이미 들어 있다.
  #   결과는 audit_log(backup.create / backup.verify / backup.failed) → 화면 '환경설정 > 로그 보관'
  #   지금 백업: docker compose exec backup backup.sh backup   /  복구 시험: ... backup.sh verify
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/usr/local/bin/backup.sh"]
    command: ["daemon"]
    # 멈출 때(재부팅·업그레이드) 신호를 pg_dump·pg_restore 까지 보내야 스크립트가 만들던 파일·임시 DB 를 지우고 끝난다
    init: true
    stop_grace_period: 30s
    mem_limit: ${WLM_BACKUP_MEM_LIMIT:-256m}
    environment:
      TINI_KILL_PROCESS_GROUP: "1"
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-wlm}
      PGPASSWORD: ${POSTGRES_PASSWORD:-wlm-dev-password}
      PGDATABASE: ${POSTGRES_DB:-wlm}
      TZ: ${WLM_DISPLAY_TZ:-Asia/Seoul}             # WLM_BACKUP_TIME 을 이 시간대로 해석
      WLM_BACKUP_TIME: ${WLM_BACKUP_TIME:-02:30}
      WLM_BACKUP_KEEP: ${WLM_BACKUP_KEEP:-14}
      WLM_BACKUP_VERIFY_WEEKDAY: ${WLM_BACKUP_VERIFY_WEEKDAY:-7}
    volumes:
      - ./deploy/backup/backup.sh:/usr/local/bin/backup.sh:ro
      - ./backups:/backups                 # 백업 파일 — 이 폴더를 다른 디스크·NAS 로 옮겨 보관 (B-17)
      - ./config:/config:ro                # 대시보드·알림 규칙도 함께 묶는다
      - pgdata:/pgdata:ro                  # 남은 공간 확인용 (복구 시험·복원은 DB 크기만큼 같은 디스크를 더 쓴다). 읽지 않는다

  # 네트워크 장비 / Linux 서버의 syslog 를 받아 api 로 전달하는 수신기 (선택)
  collector:
    image: fluent/fluent-bit:4.0
    profiles: ["syslog"]
    restart: unless-stopped
    logging: *logging
    depends_on:
      - api
    environment:
      WLM_INGEST_API_KEY: ${WLM_COLLECTOR_API_KEY:-dev-ingest-key}
    command: ["/fluent-bit/bin/fluent-bit", "-c", "/fluent-bit/etc/collector.yaml"]
    volumes:
      - ./collector/collector.yaml:/fluent-bit/etc/collector.yaml:ro
    ports:
      - "${WLM_SYSLOG_PORT:-514}:5140/udp"        # RFC3164
      - "${WLM_SYSLOG_PORT:-514}:5140/tcp"        # RFC3164
      - "${WLM_SYSLOG_5424_PORT:-1514}:5141/tcp"  # RFC5424

volumes:
  pgdata:
