# CI (BACKLOG B-15, ISMS 2.8.5·2.10.x) — 모든 push·PR 에서 테스트·린트·설정 검사·이미지 취약점 점검.
# 외부 action 은 커밋 해시로 고정한다(태그는 바뀔 수 있다 — 공급망 위험). 갱신할 때는 해시와 주석의 버전을 같이 바꾼다.
# 권한은 읽기만 (토큰으로 저장소를 바꾸지 않는다).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUENTBIT_VERSION: "4.0.14"   # deploy/airgap/make-bundle.sh 와 같게 (윈도 묶음에 넣는 버전)

jobs:
  server:
    name: 서버 테스트·린트 (개발 이미지)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      db:
        image: postgres:17-alpine
        env: { POSTGRES_USER: wlm, POSTGRES_PASSWORD: wlm, POSTGRES_DB: wlm }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wlm" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # 시험은 컨테이너 안의 배치(/app/app·/app/web·/app/config·/app/tests)를 전제로 한다 → 개발 이미지에서 그대로 돌린다
      - name: 개발 이미지 빌드
        run: docker build --target dev -f server/Dockerfile -t wlm-ci:dev .
      - name: 린트 (ruff)
        run: docker run --rm wlm-ci:dev ruff check --no-cache app tests
      - name: 테스트 (pytest — 통합 시험은 <DB>_test 를 만들어 쓴다)
        run: >-
          docker run --rm --network host -v "$PWD/tools:/app/tools:ro"
          -e WLM_DATABASE_URL=postgresql://wlm:wlm@127.0.0.1:5432/wlm
          wlm-ci:dev python -m pytest -q

  backup:
    name: 백업 스크립트 자체 시험
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      db:
        image: postgres:17-alpine
        env: { POSTGRES_USER: wlm, POSTGRES_PASSWORD: wlm, POSTGRES_DB: wlm }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wlm" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # compose 의 backup 서비스와 같은 이미지·같은 스크립트. /pgdata 는 남은 공간 확인용 (실제 DB 볼륨 대신 임시 폴더)
      - name: backup.sh selftest
        run: >-
          mkdir -p /tmp/pgdata &&
          docker run --rm --network host
          -e PGHOST=127.0.0.1 -e PGUSER=wlm -e PGPASSWORD=wlm -e PGDATABASE=wlm
          -v "$PWD/deploy/backup/backup.sh:/usr/local/bin/backup.sh:ro" -v /tmp/pgdata:/pgdata:ro
          --entrypoint /bin/sh postgres:17-alpine /usr/local/bin/backup.sh selftest

  web:
    name: 화면 모듈 시험 (node — npm 없음)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with: { node-version: "22" }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with: { python-version: "3.13" }   # 교차 퍼징이 서버 파서(표준 라이브러리만)를 python3 -I 로 부른다
      - name: 문법 (빌드 없는 ES 모듈)
        run: for f in web/js/*.js web/js/*/*.js; do node --check "$f"; done
      - name: 검색 문장 시험 + node·python3 교차 퍼징
        run: node --test 'server/tests/js/*.test.mjs'

  agents-linux:
    name: 에이전트·수집기 설정 (Fluent Bit --dry-run, 리눅스)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # TLS 정적 검사도 여기서 한다 (--dry-run 은 없는 tls.ca_file·키 오타·verify_hostname 누락을 통과시킨다)
      - name: 설정 틀 채우기 + TLS 정적 검사 (설치 스크립트와 같은 규칙)
        run: python3 tools/ci/render_agent_configs.py /tmp/agent-render
      # 렌더 스크립트는 재구현이라 install.sh 자체를 돌려 같은 결과인지 본다 (openssl 있는 Rocky, 없는 Debian)
      - name: install.sh 실행 시험 (Rocky 9 · Debian 13)
        run: |
          for img in rockylinux/rockylinux:9 debian:13-slim; do
            docker run --rm --network none -v "$PWD:/repo:ro" -v /tmp/agent-render:/render:ro "$img" bash /repo/tools/ci/test_install_sh.sh
          done
      - name: dry-run
        run: |
          docker run --rm -v /tmp/agent-render:/cfg:ro "fluent/fluent-bit:4.0" /fluent-bit/bin/fluent-bit -c /cfg/linux.yaml --dry-run
          docker run --rm -v /tmp/agent-render:/cfg:ro "fluent/fluent-bit:4.0" /fluent-bit/bin/fluent-bit -c /cfg/linux-tls.yaml --dry-run
          docker run --rm -e WLM_INGEST_API_KEY=ci -v "$PWD/collector:/cfg:ro" "fluent/fluent-bit:4.0" /fluent-bit/bin/fluent-bit -c /cfg/collector.yaml --dry-run
          docker run --rm -e SERVER_HOST=logmon.ci.internal -e SERVER_PORT=6977 -e TLS_SERVER_NAME=logmon.ci.internal -e API_KEY=ci -e PROBE_HOST=tls-probe-ci \
            -v "$PWD/tools/ci/tls-probe.yaml:/probe.yaml:ro" -v "$PWD/tools/ci/fixtures/ci-ca.crt:/tls/ca.crt:ro" \
            "fluent/fluent-bit:4.0" /fluent-bit/bin/fluent-bit -c /probe.yaml --dry-run

  agents-windows:
    name: 윈도 에이전트 설정 (Fluent Bit --dry-run, 윈도 빌드)
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"   # 러너의 파이프 출력은 cp1252 라 한글 print 가 UnicodeEncodeError 로 멈춘다
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: 설정 틀 채우기 (IIS·MSSQL 묶음을 켠 것과 기본, TLS 판) + TLS 정적 검사
        run: python tools/ci/render_agent_configs.py agent-render
      # install.cmd 가 부르는 Windows PowerShell 5.1 로 install.ps1 을 돈다 (-RenderOnly: 설치·ACL·서비스 없음).
      # 서버 묶음과 같은 경로(settings.json 의 상대 CaFile + 서버가 계산한 CaSha256)·옛 평문 묶음 + -CaFile(포트 6977)·
      # UTF-16 CA·렌더 스크립트와 바이트 비교·실패해야 하는 경우를 tools/ci/test_install_ps1.ps1 이 본다.
      # CaSha256 은 렌더 스크립트가 따로 계산한 값 (install.ps1 과 같은 코드로 재면 둘이 같이 틀려도 통과한다)
      - name: install.ps1 시험 (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $sha = python tools/ci/render_agent_configs.py --ca-sha256 tools/ci/fixtures/ci-ca.crt
          if ($LASTEXITCODE -ne 0) { throw "ca-sha256 failed" }
          $work = Join-Path $env:RUNNER_TEMP "wlm-ps1"
          & powershell -NoProfile -ExecutionPolicy Bypass -File tools\ci\test_install_ps1.ps1 -RenderDir agent-render -CaSha256 $sha -Work $work
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 tests failed" }
          # Package render: also check name, port and CA location against expected values (and dry-run it below)
          Copy-Item (Join-Path $work "pkg.yaml") agent-render\windows-ps-tls.yaml
          python tools/ci/render_agent_configs.py --check-tls agent-render\windows-ps-tls.yaml --expect-vhost logmon.ci.internal --expect-port 6977 --expect-ca-file "C:\ProgramData\wlm-agent\ca.crt"
          if ($LASTEXITCODE -ne 0) { throw "TLS static check failed on the install.ps1 package render" }
      # winevtlog 입력은 윈도 빌드에만 있다. 폐쇄망 묶음과 같은 zip 을 받아 저장소의 SHA-256 으로 확인한다
      - name: Fluent Bit 받기 (해시 확인)
        shell: pwsh
        run: |
          $zip = "fluent-bit-$env:FLUENTBIT_VERSION-win64.zip"
          Invoke-WebRequest "https://packages.fluentbit.io/windows/$zip" -OutFile $zip
          $pin = "deploy/airgap/agent-installers/$zip.sha256"
          if (-not (Test-Path $pin)) { throw "$pin is missing: commit the SHA-256 of the new Fluent Bit version (FLUENTBIT_VERSION)" }
          $want = (Get-Content $pin).Split(" ")[0].ToLower()
          $got = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($want -ne $got) { throw "SHA-256 mismatch: $got (expected $want)" }
          Expand-Archive $zip -DestinationPath fb
      - name: dry-run
        shell: pwsh
        run: |
          $exe = Get-ChildItem fb -Recurse -Filter fluent-bit.exe | Select-Object -First 1
          foreach ($cfg in "agent-render\windows.yaml", "agent-render\windows-min.yaml", "agent-render\windows-tls.yaml", "agent-render\windows-ps-tls.yaml") {
            & $exe.FullName -c $cfg --dry-run
            if ($LASTEXITCODE -ne 0) { throw "dry-run failed: $cfg" }
          }
      # 러너는 관리자라 실제 설치를 돌 수 있다: 서비스 등록·폴더 권한·CA 정리·서비스 기동을 확인하고 지운다 (B-28 실기의 일부).
      # 일반 사용자가 폴더를 미리 만들어 둔 경우를 흉내 낸다(다른 SID 의 명시 ACE) — 설치가 소유자·권한을 다시 잡아야 한다.
      # CA 는 UTF-16 으로 저장한 것 (PS 5.1 '>' 의 기본) — 설치된 ca.crt 는 OpenSSL 이 읽는 ASCII PEM 이어야 한다.
      - name: 실제 설치·권한·서비스 (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $data = "C:\ProgramData\wlm-agent"
          New-Item -ItemType Directory -Force -Path $data | Out-Null
          & icacls $data /grant "*S-1-1-0:(OI)(CI)F" | Out-Null
          $exe = (Get-ChildItem fb -Recurse -Filter fluent-bit.exe | Select-Object -First 1).FullName
          $ca16 = Join-Path $env:RUNNER_TEMP "ca-utf16.crt"
          Get-Content tools\ci\fixtures\ci-ca.crt | Out-File -Encoding Unicode $ca16
          & powershell -NoProfile -ExecutionPolicy Bypass -File agent\windows\install.ps1 -ServerHost 127.0.0.1 -ApiKey ci -CaFile $ca16 -TlsServerName logmon.ci.internal -FluentBitExe $exe -Settings none.json
          if ($LASTEXITCODE -ne 0) { throw "install failed: $LASTEXITCODE" }
          try {
            $acl = Get-Acl $data
            "owner: $($acl.Owner)"
            $acl.Access | Format-Table IdentityReference, FileSystemRights, IsInherited -AutoSize | Out-String
            $sids = $acl.Access | ForEach-Object { $_.IdentityReference.Translate([System.Security.Principal.SecurityIdentifier]).Value } | Select-Object -Unique
            $owner = (New-Object System.Security.Principal.NTAccount($acl.Owner)).Translate([System.Security.Principal.SecurityIdentifier]).Value
            if ($owner -ne "S-1-5-32-544") { throw "owner must be Administrators, got $($acl.Owner)" }
            if (@($sids | Where-Object { $_ -notin @("S-1-5-18", "S-1-5-32-544") }).Count) { throw "only SYSTEM and Administrators may have access: $($sids -join ', ')" }
            $bytes = [System.IO.File]::ReadAllBytes("$data\ca.crt")
            if ($bytes -contains 0) { throw "installed CA is not ASCII" }
            & "C:\Program Files\Git\usr\bin\openssl.exe" x509 -in "$data\ca.crt" -noout -subject
            if ($LASTEXITCODE -ne 0) { throw "OpenSSL cannot read the installed CA" }
            Start-Sleep -Seconds 8
            $svc = Get-Service knuh-agent
            "service: $($svc.Status)"
            if ($svc.Status -ne "Running") { Get-Content "$data\fluent-bit.log" -ErrorAction SilentlyContinue | Select-Object -Last 30; throw "agent service is not running" }
          } finally {
            & powershell -NoProfile -ExecutionPolicy Bypass -File agent\windows\uninstall.ps1 -RemoveData
          }

  image:
    name: 운영 이미지 취약점 점검 (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: 운영 이미지 빌드
        run: docker build --target runtime -f server/Dockerfile -t wlm-ci:runtime .
      # 고칠 수 있는 '심각(CRITICAL)'은 실패, '높음(HIGH)'은 기록만 (기반 이미지 갱신 주기와 맞추기 위해)
      - name: 심각 취약점 (실패)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: wlm-ci:runtime
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: 높음 취약점 (기록)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: wlm-ci:runtime
          severity: HIGH
          ignore-unfixed: true
          exit-code: "0"
